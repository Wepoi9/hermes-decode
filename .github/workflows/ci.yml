name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin-tests:
    name: Plugin aggregation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Run plugin tests
        run: python -m pytest tests -q

  desktop-half-syntax:
    name: Desktop half syntax and matcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check desktop/plugin.js (plain ESM, no build step)
        run: |
          cp desktop/plugin.js /tmp/hermes-decode.mjs
          node --check /tmp/hermes-decode.mjs
      - name: Test the status-bar matcher (dependency-free)
        run: node tests/desktop-match.test.mjs

  core-patch-applies:
    name: Core patch applies to its base commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone upstream Hermes and check out the base commit
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NousResearch/hermes-agent.git hermes
          git -C hermes switch --detach cca83848ec79a4a6a2ecc10285725559bf72c97c
      - name: Apply --check the decode hook patch
        run: git -C hermes apply --check "$GITHUB_WORKSPACE/patches/decode-hook.patch"

  core-patch-applies-v0222:
    name: Release patch applies to the v0.22.2 tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone upstream Hermes and check out the v0.22.2 tag commit
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NousResearch/hermes-agent.git hermes
          git -C hermes switch --detach d923a5eb487a17c0a68801bba9ef0f56c81040a8
      - name: Apply --check the v0.22.2 decode hook patch
        run: git -C hermes apply --check "$GITHUB_WORKSPACE/patches/decode-hook-v0.22.2.patch"
