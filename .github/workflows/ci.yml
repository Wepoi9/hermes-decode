name: CI

# Actions are pinned to full commit SHAs (node24-ready majors). Runners are pinned
# to ubuntu-24.04 because the ubuntu-latest label migrates to Ubuntu 26 in late 2026.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin-tests:
    name: Plugin aggregation tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (node24)
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Run plugin tests
        run: python -m pytest tests -q

  desktop-half-syntax:
    name: Desktop half syntax and matcher
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: '24'
      - name: Syntax-check desktop/plugin.js (plain ESM, no build step)
        run: |
          cp desktop/plugin.js /tmp/hermes-decode.mjs
          node --check /tmp/hermes-decode.mjs
      - name: Test the status-bar matcher and cache (dependency-free)
        run: node tests/desktop-match.test.mjs

  core-patch-applies:
    name: Core patch applies to its base commit and its tests run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (node24)
        with:
          python-version: '3.14'
      - name: Clone upstream Hermes and check out the base commit
        # The base commit is the fork PR branch's parent commit; when the PR
        # branch rebases, keep this pin and the regenerated patch in step.
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NousResearch/hermes-agent.git hermes
          git -C hermes switch --detach 4e58c721c8cf9b51c46636ea84ea6a5cb540880a
      - name: Apply --check and apply the decode hook patch
        run: |
          git -C hermes apply --check "$GITHUB_WORKSPACE/patches/decode-hook.patch"
          git -C hermes apply "$GITHUB_WORKSPACE/patches/decode-hook.patch"
      - name: Run the decode measurement tests on the applied tree
        # The patch carries both measurement files; on the main basis the chat
        # suite (including the Anthropic decode-window cases) collects cleanly,
        # so the applied tree must actually pass them, not just apply.
        # Python 3.14 installs the core's marker-gated runtime dependencies
        # from the package itself; the test toolchain mirrors upstream's own
        # pins (pytest / pytest-asyncio / anthropic at the reviewed versions).
        run: |
          pip install -e ./hermes --quiet
          pip install --quiet pytest==9.1.1 pytest-asyncio==1.3.0 anthropic==0.87.0
          cd hermes
          python -m pytest tests/agent/test_first_chunk_at_hook.py tests/agent/test_codex_first_event_timing.py -q
        env:
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""

  core-patch-applies-v0224:
    name: Release patch applies to the v0.22.4 tag and its timing tests run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (node24)
        with:
          python-version: '3.14'
      - name: Clone upstream Hermes and check out the v0.22.4 tag commit
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NousResearch/hermes-agent.git hermes
          git -C hermes switch --detach 4d04303818b61bf3aa09278af48356315515965b
      - name: Apply --check and apply the v0.22.4 decode hook patch
        run: |
          git -C hermes apply --check "$GITHUB_WORKSPACE/patches/decode-hook-v0.22.4.patch"
          git -C hermes apply "$GITHUB_WORKSPACE/patches/decode-hook-v0.22.4.patch"
      - name: Run the decode measurement tests on the applied release tree
        # On the v0.22.4 basis both measurement files run: the release branch's
        # chat-side import-time bug (tui_gateway/methods_onboarding.py
        # references Path without a pathlib import) is fixed in this release,
        # so the chat-side suite collects cleanly here as it does on main.
        run: |
          pip install -e ./hermes --quiet
          pip install --quiet pytest==9.1.1 pytest-asyncio==1.3.0 anthropic==0.87.0
          cd hermes
          python -m pytest tests/agent/test_first_chunk_at_hook.py tests/agent/test_codex_first_event_timing.py -q
        env:
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
