name: CI

# Actions are pinned to full commit SHAs (node24-ready majors). Runners are pinned
# to ubuntu-24.04 because the ubuntu-latest label migrates to Ubuntu 26 in late 2026.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin-tests:
    name: Plugin aggregation tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (node24)
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Run plugin tests
        run: python -m pytest tests -q

  desktop-half-syntax:
    name: Desktop half syntax and matcher
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: '24'
      - name: Syntax-check desktop/plugin.js (plain ESM, no build step)
        run: |
          cp desktop/plugin.js /tmp/hermes-decode.mjs
          node --check /tmp/hermes-decode.mjs
      - name: Test the status-bar matcher and cache (dependency-free)
        run: node tests/desktop-match.test.mjs

  # One patch artifact (`patches/decode-hook.patch`); the base commit is the CI's
  # choice, not part of the diff. The base is the upstream main commit the patch was
  # ported onto (see `docs/VERIFICATION.md`); when the running Hermes checkout moves,
  # re-port the patch and re-pin this commit together — a drifted base fails
  # `git apply --check` here instead of silently shipping an unusable patch.
  core-patch-applies:
    name: Core patch applies to its base commit and its tests run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (node24)
        with:
          python-version: '3.14'
      - name: Clone upstream Hermes and check out the base commit
        # The base commit is the upstream main commit the patch is regenerated
        # against; keep this pin and the regenerated patch in step.
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NousResearch/hermes-agent.git hermes
          git -C hermes switch --detach 145f26b5a5198f5a733641ef6b6c3d74f087269d
      - name: Apply --check and apply the decode hook patch
        run: |
          git -C hermes apply --check "$GITHUB_WORKSPACE/patches/decode-hook.patch"
          git -C hermes apply "$GITHUB_WORKSPACE/patches/decode-hook.patch"
      - name: Sync upstream test environment
        # Use the upstream lock: pip rejects the Python 3.14 Pillow override.
        run: |
          python -m pip install --quiet uv==0.12.3
          cd hermes
          uv sync --frozen --group dev --group test
      - name: Run the decode measurement tests on the applied tree
        # Use the upstream runner to match its isolated test behavior.
        run: scripts/run_tests.sh tests/agent/test_first_chunk_at_hook.py tests/agent/test_codex_first_event_timing.py -q --tb=short
        working-directory: hermes
        env:
          HERMES_PYTHON: ${{ github.workspace }}/hermes/.venv/bin/python
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
